name: smart-corridors-and-e-gates

services:
  hub:
    image: ${REGISTRY}corridor-hub:${HUB_VERSION}
    container_name: sceg-hub
    restart: unless-stopped
    # The buildpack sizes the JVM from this limit; without one it takes the memory free at container start.
    mem_limit: 2g
    ports:
      - "8090:8090"
    env_file:
      - ./.env.hub
    environment:
      STORAGE_S3_ENDPOINT: http://seaweedfs:8333
    # Requires the smart_corridor.hub license block.
    volumes:
      - ./secrets/iengine.lic:/etc/innovatrics/iengine.lic:ro

  cigs:
    image: ${REGISTRY}corridor-identity-grouping-service:${CIGS_VERSION}
    container_name: sceg-cigs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "8096:80"
    environment:
      # No OTLP collector in this setup.
      TRACING_ENABLED: "false"
      CORRIDOR_IDENTITY_GROUPING_SOURCE_GRAPHQL_HOST: graphql-api
      CORRIDOR_IDENTITY_GROUPING_SOURCE_GRAPHQL_PORT: 8080
      CORRIDOR_IDENTITY_GROUPING_STREAMS_APPLY_FOR_ALL_STREAMS: "true"
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_REQUIRE_FACE_TEMPLATE: "true"
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_FACE_SIZE_MIN: 15
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_FACE_QUALITY_MIN: 100
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_TEMPLATE_QUALITY_MIN: 60
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_YAW_ANGLE_MIN: -50
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_YAW_ANGLE_MAX: 50
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_PITCH_ANGLE_MIN: -50
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_PITCH_ANGLE_MAX: 50
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_ROLL_ANGLE_MIN: -50
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_ROLL_ANGLE_MAX: 50
      CORRIDOR_IDENTITY_GROUPING_GROUPING_VERIFICATION_SCORE_THRESHOLD: 35
      # Resets the identity ordinals (#N) daily at midnight in TZ (the image is UTC).
      # CORRIDOR_IDENTITY_GROUPING_GROUPING_IDENTITY_ORDINAL_DAILY_RESET: "true"
      # TZ: Europe/Bratislava
      # The values above are defaults; settings saved through the CIGS API override them and persist here.
      CIGS_SETTINGS_FILE: /var/lib/cigs/settings/overrides.json
    volumes:
      - ./secrets/iengine.lic:/etc/innovatrics/iengine.lic:ro
      - cigs-settings:/var/lib/cigs/settings

  # hub has no healthcheck: its image ships no shell or curl.
  frontend:
    image: ${REGISTRY}corridor-operational-display:${FRONTEND_VERSION}
    container_name: sceg-frontend
    restart: unless-stopped
    # nginx resolves the Hub at startup.
    depends_on:
      hub:
        condition: service_started
        restart: true
    # nginx runs as non-root (UID 101) on 8080; the image has its own healthcheck.
    ports:
      - "${FRONTEND_PORT:-8095}:8080"
    environment:
      # All data calls go through the Hub, the platform REST API too (HUB_VPP_REST_URL in .env.hub).
      HUB_URL: http://sceg-hub:8090
      # One threshold, two bands; positive = GREEN match, negative = RED match (any CSS colour).
      # CORRIDOR_SCORE_BANDS: '{"threshold":80,"lower":{"label":"Low","positive":"#f5d547","negative":"#ffa726"},"upper":{"label":"High","positive":"#59e670","negative":"#e65959"}}'
      # Operator words: unidentified, cleared, blacklisted, deniedWatchlist, liveFace, enrolledFace, connectionLost.
      # CORRIDOR_PRESENTATION_LABELS: '{"unidentified":"Unidentified"}'
      # Station serves the live camera preview through the frontend nginx. Unset: Cameras panel shows "unavailable".
      SMARTFACE_STATION_URL: http://fm-station:8000
    # Requires the smart_corridor.operational_display license block.
    volumes:
      - ./secrets/iengine.lic:/etc/innovatrics/iengine.lic:ro

volumes:
  cigs-settings:

networks:
  default:
    name: face-matcher-network
    external: true
